<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ROE · 精准规整走线设计器 | 拓扑双线轨迹版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0b0e14; font-family:'Inter',system-ui,sans-serif; padding:24px; color:#eef2ff; }
        .container { max-width:1480px; margin:0 auto; }
        .header { display:flex; justify-content:space-between; flex-wrap:wrap; margin-bottom:28px; border-bottom:1px solid rgba(197,160,89,0.3); padding-bottom:16px; }
        h1 { font-size:1.8rem; font-weight:600; background:linear-gradient(135deg,#C5A059,#FFDF8C); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .design-dashboard { display:grid; grid-template-columns:360px 1fr; gap:24px; }
        .config-panel { background:rgba(18,25,40,0.75); backdrop-filter:blur(8px); border-radius:28px; border:1px solid rgba(197,160,89,0.2); padding:20px; }
        .section-title { font-size:0.85rem; text-transform:uppercase; color:#C5A059; margin:20px 0 12px; border-left:3px solid #C5A059; padding-left:12px; }
        .selector-group { margin-bottom:20px; }
        label { display:block; font-size:0.75rem; color:#9aa6b5; margin-bottom:6px; }
        select, input { width:100%; background:#0f1320; border:1px solid #2d3748; border-radius:20px; padding:10px 16px; color:#eef2ff; font-size:0.9rem; }
        .toggles { display:flex; gap:16px; margin:20px 0; flex-wrap:wrap; }
        .toggle-item { display:flex; align-items:center; gap:8px; background:#0f1320; padding:10px 16px; border-radius:32px; width:100%; border:1px solid #2d3748; cursor:pointer; }
        .toggle-item input { width:auto; cursor:pointer; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:24px; background:#0f1320; border-radius:20px; padding:16px; }
        .stat-card { background:#0f1320; border-left:2px solid #C5A059; padding:8px 12px; }
        .stat-label { font-size:0.7 gram; color:#9aa6b5; font-size:0.7rem; }
        .stat-value { font-size:1rem; font-weight:700; color:#fff; }
        .cabling-canvas { background:#0a0c12; border-radius:24px; padding:20px; overflow-x:auto; margin-bottom:16px; border:1px solid #1a202c; text-align:center; }
        .matrix-visual { display:inline-grid; gap:16px; background:#111520; padding:28px; border-radius:16px; position:relative; }
        .cab-module {
            width:104px; background:#191e2c; border-radius:8px;
            display:flex; flex-direction:column; align-items:center; justify-content:space-between;
            border:2px solid #2e3a4e; border-top-width:6px; transition:0.1s;
            font-family: monospace; padding:8px 4px; position:relative; z-index:2;
        }
        .power-text { color:#ff6666; font-size:11px; font-weight:bold; }
        .port-text { color:#66ccff; font-size:11px; font-weight:bold; }
        .btn-group { display:flex; gap:12px; margin-top:16px; }
        .btn-pdf { background:linear-gradient(95deg,#C5A059,#B8913C); border:none; padding:12px 16px; border-radius:40px; font-weight:bold; color:#0a0e17; cursor:pointer; flex:1; text-align:center; font-size:0.85rem; }
        .btn-excel { background:#2d3e5f; border:none; padding:12px 16px; border-radius:40px; font-weight:bold; color:#fff; cursor:pointer; flex:1; text-align:center; font-size:0.85rem; }
        @media (max-width:780px) { .design-dashboard { grid-template-columns:1fr; } .cab-module { width:80px; } }
        .rule-hint { background:#1a1f2e; border-radius:12px; padding:12px; margin-bottom:16px; font-size:12px; color:#cbd5e6; border-left:4px solid #C5A059; font-family:monospace; line-height:1.5; }
        .legend-bar { display:flex; gap:16px; justify-content:center; margin-bottom:12px; font-size:12px; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>ROE · 精准规整走线设计器</h1>
        <div style="font-size:12px; text-align:right; color:#9aa6b5;">⚡ 智能物理拓扑图 | 红色电源线 & 蓝色网线 | 跨组防错断开</div>
    </div>
    <div class="design-dashboard">
        <div class="config-panel">
            <div class="selector-group"><label>📦 产品系列 / Panel Type</label><select id="productSelect"></select></div>
            <div class="section-title">📐 箱体数量输入</div>
            <div class="selector-group"><label>整块屏箱体总数 (Full Panels)</label><input type="number" id="qty-Full" min="0" step="1" value="0"></div>
            <div class="toggles"><label class="toggle-item"><input type="checkbox" id="addHalfRowCheckbox"> 🔲 整行半块 (底部追加半块屏)</label></div>
            <div class="section-title">⚙️ 系统环境</div>
            <div class="selector-group"><label>🎛️ 主控系统</label><select id="masterSelect"></select></div>
            <div class="selector-group"><label>🌐 网口带宽</label><select id="ethSelect"></select></div>
            <div class="selector-group"><label>🎨 色深/帧率</label><select id="bitRateSelect"></select></div>
            <div class="selector-group"><label>⚡ 供电电压</label><select id="voltageSelect"><option value="220">220V</option><option value="110">110V</option></select></div>
            <button id="refreshBtn" style="background:linear-gradient(135deg,#2d3e5f,#1a263d); color: white; border: none; border-radius:32px; padding:12px; width:100%; margin-top:12px; cursor:pointer; font-weight:bold;">⟳ 重新计算拓扑</button>
        </div>
        <div class="right-panel">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="rule-hint" id="ruleHint">
                📐 <b>带载分配法则状态：</b><br>
                ① N > α：单列由多根线分担，向上取整并均匀分割 (如 21/10=2.1 → 3根线均分7)。<br>
                ② N ≤ α：依据 α/N 小数点，&lt;0.5抹零(取整数列)，&gt;=0.5保留0.5列，跨列连续编号。<br>
            </div>
            <div class="legend-bar">
                <span><b style="color:#ff4d4d;">■ 红色实线：</b>电源回路走向 (● 表示首箱进线口)</span>
                <span><b style="color:#3399ff;">■ 蓝色实线：</b>网线回路走向 (● 表示首箱进线口)</span>
            </div>
            <div class="section-title">🔌 物理布局与走线拓扑 (内部短线实时相连)</div>
            <div class="cabling-canvas"><div id="cabVisual"></div></div>
            <div class="btn-group">
                <button id="exportBothPDF" class="btn-pdf">📄 导出走线蓝图 (PDF)</button>
                <button id="exportExcelEquipment" class="btn-excel">📎 导出配置清单 (Excel)</button>
            </div>
        </div>
    </div>
</div>
<script>
const productDatabase = [
    { Product: "Carbon MarkII", "Panel Type": "CB3MK2", Size: "Full", "Pixel Width": 160, "Pixel Height": 320, Power: 600, Weight: 13.6, "点间距": 5.77 },
    { Product: "Carbon MarkII", "Panel Type": "CB3MK2", Size: "Half", "Pixel Width": 160, "Pixel Height": 160, Power: 290, Weight: 13.6, "点间距": 5.77 },
    { Product: "Carbon MarkII", "Panel Type": "CB5MK2", Size: "Full", "Pixel Width": 104, "Pixel Height": 208, Power: 480, Weight: 13.6, "点间距": 5.77 },
    { Product: "Carbon MarkII", "Panel Type": "CB5MK2", Size: "Half", "Pixel Width": 104, "Pixel Height": 104, Power: 250, Weight: 13.6, "点间距": 5.77 },
    { Product: "Topaz", "Panel Type": "TP1.5", Size: "Full", "Pixel Width": 320, "Pixel Height": 320, Power: 160, Weight: 8.0, "点间距": 1.5 },
    { Product: "Topaz", "Panel Type": "TP2.6", Size: "Full", "Pixel Width": 192, "Pixel Height": 192, Power: 140, Weight: 8.0, "点间距": 2.6 },
    { Product: "Emerald", "Panel Type": "EM3.9", Size: "Vertical", "Pixel Width": 128, "Pixel Height": 256, Power: 400, Weight: 9.0, "点间距": 3.9 },
    { Product: "Emerald", "Panel Type": "EM5.9", Size: "Full", "Pixel Width": 168, "Pixel Height": 168, Power: 720, Weight: 9.0, "点间距": 5.9 },
    { Product: "Vanish ST", "Panel Type": "V4ST", Size: "Full", "Pixel Width": 216, "Pixel Height": 216, Power: 700, Weight: 8.5, "点间距": 4.8 },
    { Product: "Coral", "Panel Type": "CR0.9", Size: "Full", "Pixel Width": 640, "Pixel Height": 720, Power: 120, Weight: 7.5, "点间距": 0.9 }
];
const processorData = [
    { 主控: "Brompton", 网口: "1G", "8b60Hz": 525000, "10b60Hz": 420000, "12b60Hz": 350000, "8b120Hz": 262500, "10b120Hz": 210000, "12b120Hz": 175000 },
    { 主控: "MVR", 网口: "1G", "8b60Hz": 637500, "10b60Hz": 510000, "12b60Hz": 425000, "8b120Hz": 300000, "10b120Hz": 240000, "12b120Hz": 200000 },
    { 主控: "Nova", 网口: "1G", "8b60Hz": 650000, "10b60Hz": 480000, "12b60Hz": 325000, "8b120Hz": 325000, "10b120Hz": 240000, "12b120Hz": 162500 },
    { 主控: "Nova", 网口: "5G", "8b60Hz": 2951200, "10b60Hz": 2291312, "12b60Hz": 1475600, "8b120Hz": 1475600, "10b120Hz": 1145656, "12b120Hz": 737800 },
    { 主控: "Colorlight", 网口: "1G", "8b60Hz": 650000, "10b60Hz": 487500, "12b60Hz": 390000, "8b120Hz": 320000, "10b120Hz": 240000, "12b120Hz": 192000 }
];
const masterEthOptions = { "Brompton":["1G"], "Colorlight":["1G"], "MVR":["1G","2.5G"], "Nova":["1G","5G"] };
const bitRateList = ["8b60Hz","10b60Hz","12b60Hz","8b120Hz","10b120Hz","12b120Hz"];

let currentProductObj = null;
let lastMatrix = null;

function getFullPower() {
    if(!currentProductObj) return 400;
    let fullEntry = productDatabase.find(p => p.Product === currentProductObj.Product && p["Panel Type"] === currentProductObj["Panel Type"] && p.Size === "Full");
    return fullEntry ? fullEntry.Power : 600;
}
function getFullPixelArea() {
    if(!currentProductObj) return 51200;
    let fullEntry = productDatabase.find(p => p.Product === currentProductObj.Product && p["Panel Type"] === currentProductObj["Panel Type"] && p.Size === "Full");
    if(fullEntry) return (fullEntry["Pixel Width"] || 1) * (fullEntry["Pixel Height"] || 1);
    return 25600;
}
function getResolutionForSize(size) {
    if(!currentProductObj) return { w:1, h:1 };
    let row = productDatabase.find(p => p.Product === currentProductObj.Product && p["Panel Type"] === currentProductObj["Panel Type"] && p.Size === size);
    if(row) return { w: row["Pixel Width"] || 1, h: row["Pixel Height"] || 1 };
    let fullW = currentProductObj["Pixel Width"] || 1, fullH = currentProductObj["Pixel Height"] || 1;
    if(size === "Half") return { w: fullW, h: Math.floor(fullH / 2) };
    return { w: fullW, h: fullH };
}
function getMaxPowerLoad() { return (document.getElementById('voltageSelect').value === '220' ? 220 : 110) * 16; }
function getMaxPortPixels() {
    let master = document.getElementById('masterSelect').value;
    let eth = document.getElementById('ethSelect').value;
    let rate = document.getElementById('bitRateSelect').value;
    let record = processorData.find(p => p["主控"] === master && p["网口"] === eth) || processorData.find(p => p["主控"] === master);
    return record?.[rate] || 500000;
}

function findBestRectangle(totalFull) {
    if(totalFull <= 0) return { cols:0, rows:0 };
    let fullRes = getResolutionForSize("Full");
    let targetRatio = 16 / 9;
    let bestCols = 1, bestRows = 1, bestDiff = Infinity;
    for(let cols = 1; cols <= totalFull; cols++) {
        let rows = Math.floor(totalFull / cols);
        if(rows < 1) continue;
        let totalWpx = cols * fullRes.w, totalHpx = rows * fullRes.h;
        let diff = Math.abs((totalWpx / totalHpx) - targetRatio);
        if(diff < bestDiff) { bestDiff = diff; bestCols = cols; bestRows = rows; }
    }
    while(bestCols * bestRows > totalFull && bestRows > 1) bestRows--;
    return { cols: bestCols, rows: bestRows };
}

function generateLayoutMatrix(cols, rows, hasHalfRow) {
    let matrix = [];
    for(let r = 0; r < rows; r++) {
        let rowArray = [];
        for(let c = 0; c < cols; c++) {
            let res = getResolutionForSize("Full");
            rowArray.push({ type: "Full", pixelW: res.w, pixelH: res.h });
        }
        matrix.push(rowArray);
    }
    if(hasHalfRow && cols > 0) {
        let halfRowArray = [];
        for(let c = 0; c < cols; c++) {
            let res = getResolutionForSize("Half");
            halfRowArray.push({ type: "Half", pixelW: res.w, pixelH: res.h });
        }
        matrix.push(halfRowArray);
    }
    return matrix;
}

function assignLabelsByStrictRule(matrix, maxCap, unitCap, pathType, prefix) {
    let rows = matrix.length;
    let cols = matrix[0].length;
    let alpha = Math.max(1, Math.floor(maxCap / unitCap));
    let N = rows;
    let labels = Array(rows).fill().map(() => Array(cols).fill(''));

    if (N > alpha) {
        let k = Math.ceil(N / alpha);
        let chunkSizes = [];
        let remaining = N;
        for (let i = 0; i < k; i++) {
            let size = Math.ceil(remaining / (k - i));
            chunkSizes.push(size);
            remaining -= size;
        }

        let cableId = 1;
        for (let c = 0; c < cols; c++) {
            let rOrder = [];
            if (pathType === 'N') {
                for (let r = 0; r < rows; r++) rOrder.push(r);
            } else {
                if (c % 2 === 0) for (let r = 0; r < rows; r++) rOrder.push(r);
                else for (let r = rows - 1; r >= 0; r--) rOrder.push(r);
            }

            let rIdx = 0;
            for (let i = 0; i < k; i++) {
                let size = chunkSizes[i];
                let seqInCable = 1;
                for (let j = 0; j < size; j++) {
                    let r = rOrder[rIdx++];
                    labels[r][c] = `${prefix}${cableId}-${seqInCable++}`;
                }
                cableId++;
            }
        }
    } else {
        let ratio = alpha / N;
        let floorRatio = Math.floor(ratio);
        let decimal = ratio - floorRatio;
        
        let stepCols = decimal < 0.5 ? floorRatio : floorRatio + 0.5;
        let limitPanels = Math.floor(stepCols * N);
        if (limitPanels < 1) limitPanels = 1;

        let cableId = 1;
        let seq = 1;
        let count = 0;

        for (let c = 0; c < cols; c++) {
            let rOrder = [];
            if (pathType === 'N') {
                for (let r = 0; r < rows; r++) rOrder.push(r);
            } else {
                if (c % 2 === 0) for (let r = 0; r < rows; r++) rOrder.push(r);
                else for (let r = rows - 1; r >= 0; r--) rOrder.push(r);
            }

            for (let i = 0; i < rOrder.length; i++) {
                let r = rOrder[i];
                labels[r][c] = `${prefix}${cableId}-${seq++}`;
                count++;
                
                if (count >= limitPanels && !(c === cols - 1 && i === rOrder.length - 1)) {
                    cableId++;
                    seq = 1;
                    count = 0;
                }
            }
        }
    }
    return labels;
}

function assignAllLabels(matrix, maxPowerWatts, maxPortPixels, unitPower, unitPixels) {
    if(!matrix.length) return matrix;
    let powerLabels = assignLabelsByStrictRule(matrix, maxPowerWatts, unitPower, 'N', 'P');
    let portLabels = assignLabelsByStrictRule(matrix, maxPortPixels, unitPixels, 'S', 'D');
    
    return matrix.map((row, r) => row.map((cell, c) => ({
        ...cell,
        powerLabel: powerLabels[r][c],
        portLabel: portLabels[r][c]
    })));
}

function computeSummary(matrix) {
    if(!matrix.length) return { totalPanels:0, cols:0, rows:0, resolutionW:0, resolutionH:0, totalPowerCircuits:0, totalPorts:0, totalFullCount:0, totalHalfCount:0 };
    let rows = matrix.length, cols = matrix[0].length;
    let totalFullCount = 0, totalHalfCount = 0;
    let resolutionW = cols * matrix[0][0].pixelW;
    let resolutionH = 0;
    for(let r = 0; r < rows; r++) resolutionH += matrix[r][0].pixelH;
    let powerIds = new Set(), portIds = new Set();
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            let cell = matrix[r][c];
            if(cell.type === "Full") totalFullCount++;
            if(cell.type === "Half") totalHalfCount++;
            if(cell.powerLabel) powerIds.add(parseInt(cell.powerLabel.match(/\d+/)?.[0] || 1));
            if(cell.portLabel) portIds.add(parseInt(cell.portLabel.match(/\d+/)?.[0] || 1));
        }
    }
    return { totalPanels: totalFullCount+totalHalfCount, cols, rows, resolutionW, resolutionH, totalPowerCircuits: powerIds.size, totalPorts: portIds.size, totalFullCount, totalHalfCount };
}

function renderMainLayout(matrix) {
    if(!matrix.length) return '<div>暂无数据</div>';
    let rows = matrix.length, cols = matrix[0].length;
    let fullRes = getResolutionForSize("Full");
    let isDoubleHeight = fullRes.h >= fullRes.w * 1.95 && fullRes.h <= fullRes.w * 2.05;
    let baseHeight = isDoubleHeight ? 150 : 76;
    let halfHeight = Math.floor(baseHeight / 2);
    
    let html = `<div class="matrix-visual" style="grid-template-columns: repeat(${cols}, 104px);">`;
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            let mod = matrix[r][c];
            let portNum = parseInt(mod.portLabel.match(/D(\d+)/)?.[1] || 1);
            let borderColor = `hsl(${(portNum * 75) % 360}, 65%, 45%)`;
            let currentHeight = (mod.type === "Half") ? halfHeight : baseHeight;
            html += `<div class="cab-module" data-row="${r}" data-col="${c}" style="height:${currentHeight}px; border-top-color: ${borderColor};">
                        <div class="power-text">${mod.powerLabel}</div>
                        <div class="port-text">${mod.portLabel}</div>
                    </div>`;
        }
    }
    html += `</div>`;
    return html;
}

// 核心增强：通过动态扫描顺序序列，绘制相互平行的红蓝内部连线
function drawCablingLines() {
    let container = document.querySelector('.matrix-visual');
    if (!container || !lastMatrix || !lastMatrix.length) return;
    
    let svg = document.getElementById('cablingSvg');
    if(!svg) {
        svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.id = 'cablingSvg';
        svg.style.position = 'absolute';
        svg.style.top = '0';
        svg.style.left = '0';
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.pointerEvents = 'none';
        svg.style.zIndex = '1';
        container.appendChild(svg);
    }
    svg.innerHTML = ''; 

    let powerGroups = {}, portGroups = {};
    let rows = lastMatrix.length, cols = lastMatrix[0].length;
    
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            let cell = lastMatrix[r][c];
            let cellEl = container.querySelector(`[data-row="${r}"][data-col="${c}"]`);
            if(!cellEl) continue;
            
            let cx = cellEl.offsetLeft + cellEl.offsetWidth / 2;
            let cy = cellEl.offsetTop + cellEl.offsetHeight / 2;
            
            if(cell.powerLabel) {
                let m = cell.powerLabel.match(/P(\d+)-(\d+)/);
                if(m) {
                    let id = parseInt(m[1]), seq = parseInt(m[2]);
                    if(!powerGroups[id]) powerGroups[id] = [];
                    // 电源线整体向左上偏移16px，实现平行
                    powerGroups[id].push({ seq, x: cx - 18, y: cy - 10 });
                }
            }
            if(cell.portLabel) {
                let m = cell.portLabel.match(/D(\d+)-(\d+)/);
                if(m) {
                    let id = parseInt(m[1]), seq = parseInt(m[2]);
                    if(!portGroups[id]) portGroups[id] = [];
                    // 网线整体向右下偏移16px，互不遮挡
                    portGroups[id].push({ seq, x: cx + 18, y: cy + 10 });
                }
            }
        }
    }

    // 绘制红色电源回路
    for(let id in powerGroups) {
        let pts = powerGroups[id].sort((a,b) => a.seq - b.seq);
        if(pts.length > 0) {
            // 标记首箱进线口
            let startCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            startCircle.setAttribute("cx", pts[0].x); startCircle.setAttribute("cy", pts[0].y);
            startCircle.setAttribute("r", "5"); startCircle.setAttribute("fill", "#ff3333");
            svg.appendChild(startCircle);
            
            if(pts.length > 1) {
                let d = `M ${pts[0].x} ${pts[0].y}`;
                for(let i=1; i<pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
                let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d); path.setAttribute("stroke", "#ff3333");
                path.setAttribute("stroke-width", "3"); path.setAttribute("fill", "none");
                path.setAttribute("stroke-linecap", "round"); path.setAttribute("stroke-linejoin", "round");
                svg.appendChild(path);
            }
        }
    }

    // 绘制蓝色网线回路
    for(let id in portGroups) {
        let pts = portGroups[id].sort((a,b) => a.seq - b.seq);
        if(pts.length > 0) {
            // 标记首箱进线口
            let startCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            startCircle.setAttribute("cx", pts[0].x); startCircle.setAttribute("cy", pts[0].y);
            startCircle.setAttribute("r", "5"); startCircle.setAttribute("fill", "#2299ff");
            svg.appendChild(startCircle);
            
            if(pts.length > 1) {
                let d = `M ${pts[0].x} ${pts[0].y}`;
                for(let i=1; i<pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
                let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d); path.setAttribute("stroke", "#2299ff");
                path.setAttribute("stroke-width", "3"); path.setAttribute("fill", "none");
                path.setAttribute("stroke-linecap", "round"); path.setAttribute("stroke-linejoin", "round");
                svg.appendChild(path);
            }
        }
    }
}

function generateStaticPrintView(matrix, titleStr, mode) {
    let rows = matrix.length, cols = matrix[0].length;
    let totalWidth = 24 + cols * 90 + (cols - 1) * 5;
    let totalHeight = 24;
    for(let r=0; r<rows; r++) totalHeight += (matrix[r][0].type === "Half" ? 42 : 76);
    totalHeight += (rows - 1) * 5;

    let html = `<div style="font-family:monospace; padding:20px; background:#fff; color:#000; position:relative; width:${totalWidth + 40}px;">
        <h3 style="margin-bottom:12px; color:#111;">${titleStr}</h3>
        <div style="display:inline-grid; grid-template-columns: repeat(${cols}, 90px); gap:5px; background:#f0f2f5; padding:12px; position:relative; border-radius:8px;">`;
    
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            let mod = matrix[r][c];
            let txt = (mode === 'POWER') ? mod.powerLabel : mod.portLabel;
            let borderTopColor = mode === 'POWER' ? '#ff4d4d' : '#3399ff';
            let h = (mod.type === "Half") ? "42px" : "76px";
            html += `<div style="border:1px solid #ccc; background:#fff; border-top:4px solid ${borderTopColor}; height:${h}; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; font-weight:bold; color:#222;">
                ${txt}
            </div>`;
        }
    }
    html += `</div>`; 
    
    // 生成PDF专用的静态内联SVG走线
    let groups = {};
    for(let r=0; r<rows; r++) {
        let yTop = 12;
        for(let k=0; k<r; k++) yTop += (matrix[k][0].type === "Half" ? 42 : 76) + 5;
        let curH = (matrix[r][0].type === "Half" ? 42 : 76);
        let cy = yTop + curH / 2;
        
        for(let c=0; c<cols; c++) {
            let cell = matrix[r][c];
            let cx = 12 + c * (90 + 5) + 90 / 2;
            let label = (mode === 'POWER') ? cell.powerLabel : cell.portLabel;
            if(label) {
                let m = label.match(/([PD])(\d+)-(\d+)/);
                if(m) {
                    let id = parseInt(m[2]), seq = parseInt(m[3]);
                    if(!groups[id]) groups[id] = [];
                    groups[id].push({ seq, x: cx, y: cy });
                }
            }
        }
    }
    
    let strokeColor = (mode === 'POWER') ? '#ff3333' : '#2299ff';
    let svgPaths = '';
    for(let id in groups) {
        let pts = groups[id].sort((a,b) => a.seq - b.seq);
        if(pts.length > 0) {
            svgPaths += `<circle cx="${pts[0].x}" cy="${pts[0].y}" r="4" fill="${strokeColor}"/>`;
            if(pts.length > 1) {
                let d = `M ${pts[0].x} ${pts[0].y}`;
                for(let i=1; i<pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
                svgPaths += `<path d="${d}" stroke="${strokeColor}" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
            }
        }
    }
    
    html += `<svg style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;">${svgPaths}</svg>`;
    html += `</div>`;
    return html;
}

function exportBothPDF() {
    if(!lastMatrix) { alert("请先计算"); return; }
    let powerDiagram = generateStaticPrintView(lastMatrix, "🔌 电源工程布线蓝图 (基于 N/α 均分设计)", 'POWER');
    let networkDiagram = generateStaticPrintView(lastMatrix, "🌐 网线工程布线蓝图 (基于 N/α 路由控制)", 'PORT');
    let fullHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ROE Cabling Blueprint</title></head>
        <body style="padding:15px; background:white;"><div style="page-break-after:always;">${powerDiagram}</div><div>${networkDiagram}</div></body></html>`;
    let el = document.createElement('div'); el.innerHTML = fullHtml; document.body.appendChild(el);
    html2pdf().from(el).set({ filename: `ROE_Cabling_Blueprint.pdf`, html2canvas: { scale: 2 }, jsPDF: { orientation: 'landscape' } }).save().then(()=>document.body.removeChild(el));
}

function exportExcel() {
    if(!currentProductObj || !lastMatrix) return;
    let s = computeSummary(lastMatrix);
    let hasHalfRow = document.getElementById('addHalfRowCheckbox').checked;
    let displayRows = hasHalfRow ? `${s.rows}.5` : `${s.rows}`;
    let data = [
        ["参数项目","计算数值结果"],
        ["产品型号",`${currentProductObj.Product} [${currentProductObj["Panel Type"]}]`],
        ["整块数量",`${s.totalFullCount} pcs`],
        ["半块数量",`${s.totalHalfCount} pcs`],
        ["阵列规模",`${s.cols} 列 × ${displayRows} 行 (N)`],
        ["物理总分辨率",`${s.resolutionW} × ${s.resolutionH}`],
        ["主控系统",document.getElementById('masterSelect').value],
        ["网口带宽规格",document.getElementById('ethSelect').value],
        ["现场主供电电压",document.getElementById('voltageSelect').value + "V"],
        ["核心电源总回路 (主线)",`${s.totalPowerCircuits} 根`],
        ["核心网口总回路 (网线)",`${s.totalPorts} 根`]
    ];
    let ws = XLSX.utils.aoa_to_sheet(data);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "最低配置物料清单");
    XLSX.writeFile(wb, `ROE_Cabling_Design_List.xlsx`);
}

function computeSystem() {
    if(!currentProductObj) return;
    let totalFull = parseInt(document.getElementById('qty-Full').value,10) || 0;
    let hasHalfRow = document.getElementById('addHalfRowCheckbox').checked;
    if(totalFull <= 0) { 
        document.getElementById('cabVisual').innerHTML = ''; 
        document.getElementById('statsGrid').innerHTML = '';
        return; 
    }
    let { cols, rows } = findBestRectangle(totalFull);
    if(cols===0 || rows===0) return;
    
    let rawMatrix = generateLayoutMatrix(cols, rows, hasHalfRow);
    
    let unitPower = getFullPower();
    let maxPowerWatts = getMaxPowerLoad();
    let powerAlpha = Math.max(1, Math.floor(maxPowerWatts / unitPower));
    
    let unitPixels = getFullPixelArea();
    let maxPortPixels = getMaxPortPixels();
    
    let labeledMatrix = assignAllLabels(rawMatrix, maxPowerWatts, maxPortPixels, unitPower, unitPixels);
    lastMatrix = labeledMatrix;
    let s = computeSummary(labeledMatrix);
    
    document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="stat-label">总分辨率</div><div class="stat-value">${s.resolutionW}×${s.resolutionH}</div></div>
        <div class="stat-card"><div class="stat-label">物理高 (N)</div><div class="stat-value">${rows} 行箱体</div></div>
        <div class="stat-card"><div class="stat-label">电源带载理论值 (α)</div><div class="stat-value" style="color:#ff6666;">${powerAlpha} 个</div></div>
        <div class="stat-card"><div class="stat-label">总电源主线 (红)</div><div class="stat-value" style="color:#ff6666;">${s.totalPowerCircuits} 根</div></div>
        <div class="stat-card"><div class="stat-label">物理屏体总宽</div><div class="stat-value">${s.cols} 列箱体</div></div>
        <div class="stat-card"><div class="stat-label">总网线数量 (蓝)</div><div class="stat-value" style="color:#66ccff;">${s.totalPorts} 根</div></div>
    `;
    
    document.getElementById('cabVisual').innerHTML = renderMainLayout(labeledMatrix);
    // 延迟50ms等待浏览器完成DOM树布局计算，从而精确读取容器元素的offset
    setTimeout(drawCablingLines, 50);
}

function initApp() {
    const productSelect = document.getElementById('productSelect');
    productSelect.innerHTML = '<option value="">-- 请选择ROE箱体型号 --</option>';
    const groups = new Map();
    productDatabase.forEach(item => { const key = `${item.Product} | ${item["Panel Type"]}`; groups.set(key, item); });
    for(let [key] of groups) { let opt = document.createElement('option'); opt.value = key; opt.textContent = key; productSelect.appendChild(opt); }
    productSelect.onchange = () => { const val = productSelect.value; if(!val) return; currentProductObj = productDatabase.find(i => `${i.Product} | ${i["Panel Type"]}` === val); computeSystem(); };
    
    let masters = [...new Set(processorData.map(p => p["主控"]))];
    let masterSel = document.getElementById('masterSelect');
    masterSel.innerHTML = masters.map(m => `<option value="${m}">${m}</option>`).join('');
    masterSel.onchange = () => { updateEthOptions(masterSel.value); computeSystem(); };
    
    function updateEthOptions(master) { 
        let ethSelect = document.getElementById('ethSelect'); 
        let available = masterEthOptions[master] || ["1G"]; 
        ethSelect.innerHTML = available.map(eth => `<option value="${eth}">${eth}</option>`).join(''); 
        ethSelect.value = available.includes("1G") ? "1G" : available[0]; 
    }
    
    let bitSel = document.getElementById('bitRateSelect');
    bitSel.innerHTML = bitRateList.map(r => `<option value="${r}">${r.toUpperCase()}</option>`).join('');
    bitSel.onchange = () => computeSystem();
    
    updateEthOptions(masterSel.value);
    document.getElementById('qty-Full').addEventListener('input', computeSystem);
    document.getElementById('addHalfRowCheckbox').onchange = computeSystem;
    document.getElementById('voltageSelect').onchange = computeSystem;
    document.getElementById('refreshBtn').onclick = computeSystem;
    document.getElementById('exportBothPDF').onclick = exportBothPDF;
    document.getElementById('exportExcelEquipment').onclick = exportExcel;
    
    // 窗口尺寸变化时重新计算划线坐标
    window.onresize = () => drawCablingLines();
}
initApp();
</script>

/* 调整后的 toggle-item：始终带有底色，宽度自适应 */
.toggle-item { 
    display: flex; 
    align-items: center; 
    justify-content: flex-start; 
    gap: 8px; 
    /* 始终保持填充色 */
    background: rgba(34, 211, 238, 0.1); 
    padding: 8px 14px;

    cursor: pointer; 
    font-size: 0.8rem; 
    transition: 0.2s;
    color: #eef2ff;
}

/* 悬停 */
.toggle-item:hover {
    background: rgba(34, 211, 238, 0.2);
    border-color: #22d3ee;
}

/* 勾选后 */

    border-color: #fde68a;
    color: #fde68a;
}

/* 勾选后悬停 */

    background: rgba(253, 230, 138, 0.25);
    border-color: #facc15;
}

        .stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-bottom:18px; background:#0f1320; border-radius:20px; padding:14px; }

    { "主控": "Colorlight", "网口": "1G", "8b24Hz": "1,625,000", "8b30Hz": "1,300,000", "8b48Hz": "812,500", "8b50Hz": "780,000", "8b60Hz": "650,000", "8b120Hz": "320,000", "10b24Hz": "1,218,750", "10b30Hz": "975,000", "10b48Hz": "609,375", "10b50Hz": "585,000", "10b60Hz": "487,500", "10b120Hz": "240,000", "12b24Hz": "975,000", "12b30Hz": "780,000", "12b48Hz": "487,500", "12b50Hz": "468,000", "12b60Hz": "390,000", "12b120Hz": "192,000" }
];

let currentProductObj = { model: "未知", pixelW: 160, pixelH: 320, power: 600 };
let _fullCount = 0;
let _currentSystem = "Brompton";
let _currentBandwidth = "1G";
let lastMatrix = null;
let customPortCapacities = JSON.parse(localStorage.getItem('customPortCapacities') || '{}');
const MASTER_CANVAS_PRESETS = [
    { key: "2K", label: "2K 1920×1080", width: 1920, height: 1080, systems: null },
    { key: "4K", label: "4K 3840×2160", width: 3840, height: 2160, systems: null },
    { key: "8K", label: "8K 7680×4320", width: 7680, height: 4320, systems: ["Nova", "MVR"] }
];

function getAllowedMasterCanvases() {
    return MASTER_CANVAS_PRESETS.filter(item => !item.systems || item.systems.includes(_currentSystem));
}

function updateMasterCanvasOptions() {
    const canvasSelect = document.getElementById('masterCanvasSelect');
    if (!canvasSelect) return;
    const previousValue = canvasSelect.value;
    const allowed = getAllowedMasterCanvases();
    canvasSelect.innerHTML = '';
    allowed.forEach(item => {
        canvasSelect.add(new Option(item.label, item.key));
    });
    if (allowed.some(item => item.key === previousValue)) {
        canvasSelect.value = previousValue;
    } else if (allowed.some(item => item.key === "4K")) {
        canvasSelect.value = "4K";
    } else {
        canvasSelect.value = allowed[0]?.key || "2K";
    }
}

function getCurrentMasterCanvas() {
    const canvasSelect = document.getElementById('masterCanvasSelect');
    const selectedKey = canvasSelect?.value || "4K";
    return getAllowedMasterCanvases().find(item => item.key === selectedKey) || getAllowedMasterCanvases()[0] || MASTER_CANVAS_PRESETS[0];
}

function getMaxPortPixels() {
    let rate = document.getElementById('bitRateSelect').value;
    let customKey = `${_currentSystem}|${_currentBandwidth}|${rate}`;
    if (customPortCapacities[customKey]) {
        document.getElementById('pixelSourceSpan').innerHTML = '<span class="custom-badge">📝 自定义</span>';
        return customPortCapacities[customKey];
    }
    let record = processorData.find(p => p["主控"] === _currentSystem && p["网口"] === _currentBandwidth);
    if (record && record[rate]) {
        let val = parseInt(record[rate].toString().replace(/,/g, ''), 10);
        document.getElementById('pixelSourceSpan').innerHTML = '<span class="custom-badge">📚 预设库</span>';
        return val;
    }
    document.getElementById('pixelSourceSpan').innerHTML = '<span class="custom-badge" style="background:#ff8866;">⚠️ 未配置</span>';
    return 650000;
}

function getFullPower() { return currentProductObj.power; }
function getFullPixelArea() { return currentProductObj.pixelW * currentProductObj.pixelH; }
function getMaxPowerLoad() { 
    let val = document.getElementById('voltageSelect').value;
    let parts = val.split('|'); 
    return parseInt(parts[0], 10) * parseInt(parts[1], 10); 
}

function updateBitRateOptions() {
    const rateSel = document.getElementById('bitRateSelect');
    const record = processorData.find(p => p["主控"] === _currentSystem && p["网口"] === _currentBandwidth);
    rateSel.innerHTML = '';
    let availableRates = [];
    if (record) {
        availableRates = Object.keys(record).filter(k => k.includes('b') && record[k]);
    } else {
        availableRates = ["8b60Hz","10b60Hz","12b60Hz"];
    }
    if (availableRates.length === 0) availableRates = ["10b60Hz"];
    availableRates.forEach(r => rateSel.add(new Option(r.toUpperCase(), r)));
    if (availableRates.includes('10b60Hz')) rateSel.value = '10b60Hz';
    else rateSel.selectedIndex = 0;
}

function findBestRectangle(totalFull, pixelW, pixelH) {
    if (totalFull <= 0) return { cols: 1, rows: 1 };
    let bestCols = 1, bestRows = 1, bestDiff = Infinity;
    for (let cols = 1; cols <= totalFull; cols++) {
        let rows = Math.floor(totalFull / cols);
        if (rows < 1) continue;
        let ratio = (cols * pixelW) / (rows * pixelH);
        let diff = Math.abs(ratio - 16/9);
        if (diff < bestDiff) { bestDiff = diff; bestCols = cols; bestRows = rows; }
    }
    while (bestCols * bestRows > totalFull && bestRows > 1) bestRows--;
    return { cols: bestCols, rows: bestRows };
}

// ======================= 基于真实物理负载累加的核心走线算法 =======================
function assignLabelsByStrictRule(matrix, maxCap, unitCap, pathType, prefix, direction) {
    let rows = matrix.length, cols = matrix[0].length;
    let labels = Array(rows).fill().map(() => Array(cols).fill(''));
    
    // 如果是 Half 面板，功耗/像素占用严格算作 0.5
    const getLoad = (r, c) => matrix[r][c].type === "Half" ? (unitCap * 0.5) : unitCap;

    if (direction === 'vertical') {
        let maxColLoad = 0;
        for (let c = 0; c < cols; c++) {
            let cL = 0; for (let r = 0; r < rows; r++) cL += getLoad(r, c);
            if (cL > maxColLoad) maxColLoad = cL;
        }

        if (maxColLoad > maxCap) {
            // 单列超载：在列内部进行均衡截断
            let cableId = 1;
            for (let c = 0; c < cols; c++) {
                let colLoad = 0; for(let r=0; r<rows; r++) colLoad += getLoad(r,c);
                let expectedK = Math.ceil(colLoad / maxCap);
                let rowSplits = [];
                let rIdx = 0, remainingRows = rows;
                
                while (remainingRows > 0) {
                    let currentK = Math.max(1, expectedK - rowSplits.length);
                    let targetSize = Math.ceil(remainingRows / currentK);
                    let actualSize = 0, chunkLoad = 0;
                    for (let j = 0; j < targetSize; j++) {
                        if (rIdx + j < rows) {
                            if (chunkLoad + getLoad(rIdx + j, c) > maxCap && actualSize > 0) break;
                            chunkLoad += getLoad(rIdx + j, c);
                            actualSize++;
                        }
                    }
                    if (actualSize === 0) actualSize = 1; 
                    let chunk = [];
                    for (let j = 0; j < actualSize; j++) chunk.push(rIdx++);
                    rowSplits.push(chunk);
                    remainingRows -= actualSize;
                }

                for (let chunk of rowSplits) {
                    let seq = 1;
                    for (let r of chunk) labels[r][c] = `${prefix}${cableId}-${seq++}`;
                    cableId++;
                }
            }
        } else {
            // 多列合并：自动按照列进行聚合
            let totalLoad = 0; for(let r=0; r<rows; r++) for(let c=0; c<cols; c++) totalLoad += getLoad(r,c);
            let expectedK = Math.ceil(totalLoad / maxCap);
            let colChunks = [];
            let cIdx = 0, remainingCols = cols;
            
            while (remainingCols > 0) {
                let currentK = Math.max(1, expectedK - colChunks.length);
                let targetSize = Math.ceil(remainingCols / currentK);
                let actualSize = 0, chunkLoad = 0;
                for (let j = 0; j < targetSize; j++) {
                    if (cIdx + j < cols) {
                        let cL = 0; for(let r=0; r<rows; r++) cL += getLoad(r, cIdx+j);
                        if (chunkLoad + cL > maxCap && actualSize > 0) break;
                        chunkLoad += cL;
                        actualSize++;
                    }
                }
                if (actualSize === 0) actualSize = 1;
                let chunk = [];
                for(let j=0; j<actualSize; j++) chunk.push(cIdx++);
                colChunks.push(chunk);
                remainingCols -= actualSize;
            }

            let cableId = 1;
            for (let chunk of colChunks) {
                let seq = 1, currentDir = 1;
                for (let c of chunk) {
                    if (pathType === 'N') currentDir = 1;
                    else if (seq === 1) currentDir = 1;
                    else currentDir = -currentDir;

                    let rOrder = [];
                    if (currentDir === 1) for(let r=0; r<rows; r++) rOrder.push(r);
                    else for(let r=rows-1; r>=0; r--) rOrder.push(r);

                    for (let r of rOrder) labels[r][c] = `${prefix}${cableId}-${seq++}`;
                }
                cableId++;
            }
        }
    } else {
        // 横向走线逻辑
        let maxRowLoad = 0;
        for (let r = 0; r < rows; r++) {
            let rL = 0; for (let c = 0; c < cols; c++) rL += getLoad(r, c);
            if (rL > maxRowLoad) maxRowLoad = rL;
        }

        if (maxRowLoad > maxCap) {
            let cableId = 1;
            for (let r = 0; r < rows; r++) {
                let rowLoad = 0; for(let c=0; c<cols; c++) rowLoad += getLoad(r,c);
                let expectedK = Math.ceil(rowLoad / maxCap);
                let colSplits = [];
                let cIdx = 0, remainingCols = cols;
                
                while (remainingCols > 0) {
                    let currentK = Math.max(1, expectedK - colSplits.length);
                    let targetSize = Math.ceil(remainingCols / currentK);
                    let actualSize = 0, chunkLoad = 0;
                    for (let j = 0; j < targetSize; j++) {
                        if (cIdx + j < cols) {
                            if (chunkLoad + getLoad(r, cIdx + j) > maxCap && actualSize > 0) break;
                            chunkLoad += getLoad(r, cIdx + j);
                            actualSize++;
                        }
                    }
                    if (actualSize === 0) actualSize = 1;
                    let chunk = [];
                    for (let j = 0; j < actualSize; j++) chunk.push(cIdx++);
                    colSplits.push(chunk);
                    remainingCols -= actualSize;
                }

                for (let chunk of colSplits) {
                    let seq = 1;
                    for (let c of chunk) labels[r][c] = `${prefix}${cableId}-${seq++}`;
                    cableId++;
                }
            }
        } else {
            let totalLoad = 0; for(let r=0; r<rows; r++) for(let c=0; c<cols; c++) totalLoad += getLoad(r,c);
            let expectedK = Math.ceil(totalLoad / maxCap);
            let rowChunks = [];
            let rIdx = 0, remainingRows = rows;
            
            while (remainingRows > 0) {
                let currentK = Math.max(1, expectedK - rowChunks.length);
                let targetSize = Math.ceil(remainingRows / currentK);
                let actualSize = 0, chunkLoad = 0;
                for (let j = 0; j < targetSize; j++) {
                    if (rIdx + j < rows) {
                        let rL = 0; for(let c=0; c<cols; c++) rL += getLoad(rIdx+j, c);
                        if (chunkLoad + rL > maxCap && actualSize > 0) break;
                        chunkLoad += rL;
                        actualSize++;
                    }
                }
                if (actualSize === 0) actualSize = 1;
                let chunk = [];
                for (let j = 0; j < actualSize; j++) chunk.push(rIdx++);
                rowChunks.push(chunk);
                remainingRows -= actualSize;
            }

            let cableId = 1;
            for (let chunk of rowChunks) {
                let seq = 1, currentDir = 1;
                for (let r of chunk) {
                    if (pathType === 'N') currentDir = 1;
                    else if (seq === 1) currentDir = 1;
                    else currentDir = -currentDir;

                    let cOrder = [];
                    if (currentDir === 1) for(let c=0; c<cols; c++) cOrder.push(c);
                    else for(let c=cols-1; c>=0; c--) cOrder.push(c);

                    for (let c of cOrder) labels[r][c] = `${prefix}${cableId}-${seq++}`;
                }
                cableId++;
            }
        }
    }
    return labels;
}

function sumRowPixelHeight(matrix, startRow, rowCount) {
    let total = 0;
    for (let r = startRow; r < startRow + rowCount; r++) {
        total += matrix[r]?.[0]?.pixelH || currentProductObj.pixelH;
    }
    return total;
}

function getRowsThatFitCanvas(matrix, startRow, availableRows, canvasHeight) {
    let totalHeight = 0;
    let count = 0;
    for (let r = startRow; r < startRow + availableRows; r++) {
        let rowHeight = matrix[r]?.[0]?.pixelH || currentProductObj.pixelH;
        if (count > 0 && totalHeight + rowHeight > canvasHeight) break;
        totalHeight += rowHeight;
        count++;
        if (totalHeight >= canvasHeight) break;
    }
    return Math.max(1, count);
}

function sortScreenRects(rects) {
    rects.sort((a, b) => (a.r - b.r) || (a.c - b.c));
}

function sortFreeRects(rects) {
    rects.sort((a, b) => (a.y - b.y) || (a.x - b.x));
}

function splitScreenRect(rect, takeRows, takeCols) {
    let parts = [];
    if (rect.cols > takeCols) {
        parts.push({ r: rect.r, c: rect.c + takeCols, rows: takeRows, cols: rect.cols - takeCols });
    }
    if (rect.rows > takeRows) {
        parts.push({ r: rect.r + takeRows, c: rect.c, rows: rect.rows - takeRows, cols: rect.cols });
    }
    return parts;
}

function splitFreeRect(freeRect, takeCols, takeHeight) {
    let parts = [];
    if (freeRect.cols > takeCols) {
        parts.push({
            x: freeRect.x + takeCols,
            y: freeRect.y,
            cols: freeRect.cols - takeCols,
            height: takeHeight
        });
    }
    if (freeRect.height > takeHeight) {
        parts.push({
            x: freeRect.x,
            y: freeRect.y + takeHeight,
            cols: freeRect.cols,
            height: freeRect.height - takeHeight
        });
    }
    return parts;
}

function partitionColumnsEvenly(totalCols, groupCount, maxCols) {
    if (groupCount < 1 || groupCount > totalCols) return null;
    const base = Math.floor(totalCols / groupCount);
    const extra = totalCols % groupCount;
    let groups = [];
    let c = 0;
    for (let i = 0; i < groupCount; i++) {
        const cols = base + (i < extra ? 1 : 0);
        if (cols < 1 || cols > maxCols) return null;
        groups.push({ c, cols });
        c += cols;
    }
    return groups;
}

function partitionRowsBalanced(matrix, groupCount, maxHeight) {
    const rows = matrix.length;
    if (groupCount < 1 || groupCount > rows) return null;
    let heights = [];
    for (let r = 0; r < rows; r++) heights.push(matrix[r][0]?.pixelH || currentProductObj.pixelH);
    let prefix = [0];
    for (let h of heights) prefix.push(prefix[prefix.length - 1] + h);
    const totalHeight = prefix[prefix.length - 1];
    const target = totalHeight / groupCount;
    let dp = Array.from({ length: groupCount + 1 }, () => Array(rows + 1).fill(null));
    dp[0][0] = { score: 0, prev: -1 };

    for (let g = 1; g <= groupCount; g++) {
        for (let i = g; i <= rows; i++) {
            for (let j = g - 1; j < i; j++) {
                if (!dp[g - 1][j]) continue;
                const height = prefix[i] - prefix[j];
                if (height > maxHeight) continue;
                const score = dp[g - 1][j].score + Math.pow(height - target, 2);
                if (!dp[g][i] || score < dp[g][i].score) dp[g][i] = { score, prev: j };
            }
        }
    }
    if (!dp[groupCount][rows]) return null;

    let groups = [];
    let i = rows;
    for (let g = groupCount; g >= 1; g--) {
        const prev = dp[g][i].prev;
        groups.unshift({ r: prev, rows: i - prev, height: prefix[i] - prefix[prev] });
        i = prev;
    }
    return groups;
}

function scoreCanvasGrid(rowGroups, colGroups, unitWidth, canvas, totalWidth, totalHeight) {
    let loads = [];
    let aspectPenalty = 0;
    for (let rowGroup of rowGroups) {
        for (let colGroup of colGroups) {
            const width = colGroup.cols * unitWidth;
            const load = width * rowGroup.height;
            loads.push(load);
            aspectPenalty += Math.abs((width / rowGroup.height) - (canvas.width / canvas.height));
        }
    }
    const avg = loads.reduce((sum, load) => sum + load, 0) / loads.length;
    const spread = Math.max(...loads) - Math.min(...loads);
    const gridAspect = colGroups.length / rowGroups.length;
    const screenAspect = totalWidth / totalHeight;
    return (spread / Math.max(avg, 1)) * 1000 + Math.abs(gridAspect - screenAspect) * 80 + aspectPenalty;
}

function buildControllerCanvasPlan(matrix, canvas) {
    const rows = matrix.length;
    const cols = matrix[0].length;
    const unitWidth = currentProductObj.pixelW || 1;
    const totalWidth = cols * unitWidth;
    const totalHeight = sumRowPixelHeight(matrix, 0, rows);
    const totalPixels = totalWidth * totalHeight;
    const canvasPixels = canvas.width * canvas.height;
    const maxCols = Math.max(1, Math.floor(canvas.width / unitWidth));
    const maxRows = getRowsThatFitCanvas(matrix, 0, rows, canvas.height);
    const minByArea = Math.max(1, Math.ceil(totalPixels / canvasPixels));
    const minByWidth = Math.max(1, Math.ceil(cols / maxCols));
    let minByHeight = 1;
    let accHeight = 0;
    for (let r = 0; r < rows; r++) {
        const rowHeight = matrix[r][0]?.pixelH || currentProductObj.pixelH;
        if (accHeight > 0 && accHeight + rowHeight > canvas.height) {
            minByHeight++;
            accHeight = 0;
        }
        accHeight += rowHeight;
    }

    let best = null;
    const minControllerCount = Math.max(minByArea, minByWidth * minByHeight);
    const maxControllerCount = Math.max(minControllerCount, rows * cols);

    for (let usedCount = minControllerCount; usedCount <= maxControllerCount; usedCount++) {
        for (let rowCount = 1; rowCount <= Math.min(rows, usedCount); rowCount++) {
            const colCount = Math.ceil(usedCount / rowCount);
            if (colCount < 1 || colCount > cols || rowCount * colCount !== usedCount) continue;
            const colGroups = partitionColumnsEvenly(cols, colCount, maxCols);
            if (!colGroups) continue;
            const rowGroups = partitionRowsBalanced(matrix, rowCount, canvas.height);
            if (!rowGroups) continue;
            const score = scoreCanvasGrid(rowGroups, colGroups, unitWidth, canvas, totalWidth, totalHeight);
            if (!best || usedCount < best.usedCount || (usedCount === best.usedCount && score < best.score)) {
                best = { usedCount, rowGroups, colGroups, score };
            }
        }
        if (best && best.usedCount === usedCount) break;
    }

    if (!best) {
        best = {
            usedCount: rows * cols,
            rowGroups: Array.from({ length: rows }, (_, r) => ({ r, rows: 1, height: matrix[r][0]?.pixelH || currentProductObj.pixelH })),
            colGroups: Array.from({ length: cols }, (_, c) => ({ c, cols: 1 })),
            score: 0
        };
    }

    let controllers = [];
    let controllerId = 1;
    for (let rowGroup of best.rowGroups) {
        for (let colGroup of best.colGroups) {
            controllers.push({
                id: controllerId++,
                pieces: [{
                    controllerId,
                    r: rowGroup.r,
                    c: colGroup.c,
                    rows: rowGroup.rows,
                    cols: colGroup.cols
                }]
            });
        }
    }

    controllers.forEach(controller => {
        controller.pieces.forEach(piece => piece.controllerId = controller.id);
    });

    return {
        controllers,
        maxCols,
        maxRows,
        rowGroups: best.rowGroups,
        colGroups: best.colGroups,
        canvasPixels
    };
}

function offsetPortLabel(label, offset) {
    return label.replace(/^D(\d+)-(\d+)$/, (_, portId, seq) => `D${parseInt(portId, 10) + offset}-${seq}`);
}

function getMaxPortId(labels) {
    let maxId = 0;
    for (let row of labels) {
        for (let label of row) {
            let match = label.match(/^D(\d+)-/);
            if (match) maxId = Math.max(maxId, parseInt(match[1], 10));
        }
    }
    return maxId;
}

function assignPortLabelsByControllerCanvas(matrix, maxCap, unitCap, direction) {
    const canvas = getCurrentMasterCanvas();
    const plan = buildControllerCanvasPlan(matrix, canvas);
    const rows = matrix.length;
    const cols = matrix[0].length;
    let labels = Array(rows).fill().map(() => Array(cols).fill(''));
    let controllerIds = Array(rows).fill().map(() => Array(cols).fill(0));
    let controllerSummaries = [];

    for (let controller of plan.controllers) {
        let portOffset = 0;
        for (let piece of controller.pieces) {
            let subMatrix = [];
            for (let r = piece.r; r < piece.r + piece.rows; r++) {
                let row = [];
                for (let c = piece.c; c < piece.c + piece.cols; c++) row.push(matrix[r][c]);
                subMatrix.push(row);
            }

            let localLabels = assignLabelsByStrictRule(subMatrix, maxCap, unitCap, 'S', 'D', direction);
            let localMaxPortId = getMaxPortId(localLabels);
            for (let r = 0; r < piece.rows; r++) {
                for (let c = 0; c < piece.cols; c++) {
                    labels[piece.r + r][piece.c + c] = offsetPortLabel(localLabels[r][c], portOffset);
                    controllerIds[piece.r + r][piece.c + c] = controller.id;
                }
            }
            portOffset += localMaxPortId;
        }
        controllerSummaries.push({ id: controller.id, portCount: portOffset, pieces: controller.pieces.length });
    }

    return {
        labels,
        controllerIds,
        controllerSummaries,
        canvas,
        maxCols: plan.maxCols,
        maxRows: plan.maxRows
    };
}

function computeSystem() {
    let totalFull = _fullCount;
    if (totalFull <= 0) {
        document.getElementById('cabVisual').innerHTML = '<div style="padding:30px;">⏳ 等待备品系统推送数据 (totalFull)...</div>';
        document.getElementById('statsGrid').innerHTML = '';
        return;
    }
    let colsInput = document.getElementById('customCols');
    let rowsInput = document.getElementById('customRows');
    let useCols = parseInt(colsInput.value, 10) || 1;
    let useRows = parseInt(rowsInput.value, 10) || 1;
    let warnDiv = document.getElementById('dimensionWarning');
    if (useCols * useRows > totalFull) {
        colsInput.classList.add('input-error'); rowsInput.classList.add('input-error');
        warnDiv.style.display = 'block';
        return;
    } else {
        colsInput.classList.remove('input-error'); rowsInput.classList.remove('input-error');
        warnDiv.style.display = 'none';
    }
    
    let hasHalfRow = document.getElementById('addHalfRowCheckbox').checked;
    let matrix = [];
    let w = currentProductObj.pixelW;
    let h = currentProductObj.pixelH;
    for (let r = 0; r < useRows; r++) {
        let rowArr = [];
        for (let c = 0; c < useCols; c++) rowArr.push({ type: "Full", pixelW: w, pixelH: h });
        matrix.push(rowArr);
    }
    if (hasHalfRow) {
        let halfArr = [];
        for (let c = 0; c < useCols; c++) halfArr.push({ type: "Half", pixelW: w, pixelH: Math.floor(h/2) });
        matrix.push(halfArr);
    }
    
    let maxPower = getMaxPowerLoad(), unitPower = getFullPower();
    let maxPixels = getMaxPortPixels(), unitPixels = getFullPixelArea();
    let direction = document.getElementById('routeDirectionSelect').value;
    
    // 执行高精度负载算法
    let powerLabels = assignLabelsByStrictRule(matrix, maxPower, unitPower, 'N', 'P', direction);
    let portPlan = assignPortLabelsByControllerCanvas(matrix, maxPixels, unitPixels, direction);
    let portLabels = portPlan.labels;
    let controllerIds = portPlan.controllerIds;
    
    // 计算并统计真实物理负载 (功率和像素面积累加)
    let powerLoadMap = new Map();
    let portLoadMap = new Map();
    
    for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[0].length; c++) {
            let pId = powerLabels[r][c].split('-')[0];
            let dId = `M${controllerIds[r][c]}-${portLabels[r][c].split('-')[0]}`;
            
            let loadPower = matrix[r][c].type === "Half" ? (unitPower * 0.5) : unitPower;
            let loadPixels = matrix[r][c].type === "Half" ? (unitPixels * 0.5) : unitPixels;
            
            powerLoadMap.set(pId, (powerLoadMap.get(pId) || 0) + loadPower);
            portLoadMap.set(dId, (portLoadMap.get(dId) || 0) + loadPixels);
        }
    }
    
    let totalPowerCables = powerLoadMap.size;
    let totalPortCables = portLoadMap.size;
    let peakPowerLoadActual = Math.max(...powerLoadMap.values(), 0);
    let peakPortLoadActual = Math.max(...portLoadMap.values(), 0);
    
    lastMatrix = matrix.map((row, r) => row.map((cell, c) => ({
        ...cell,
        controllerId: controllerIds[r][c],
        controllerLabel: `M${controllerIds[r][c]}`,
        powerLabel: powerLabels[r][c],
        portLabel: portLabels[r][c]
    })));
    
    let totalResW = useCols * w;
    let totalResH = useRows * h + (hasHalfRow ? h/2 : 0);
    
    document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="stat-label">🖥️ 总分辨率</div><div class="stat-value">${totalResW}×${Math.floor(totalResH)}</div></div>
        <div class="stat-card"><div class="stat-label"> ▦  大屏宽高</div><div class="stat-value">${useCols} × ${useRows + (hasHalfRow ? 0.5 : 0)}</div></div>
        <div class="stat-card"><div class="stat-label">🎛️ 主控画布</div><div class="stat-value">${portPlan.canvas.key} <span style="font-size:0.7em;color:#9aa6b5">${portPlan.canvas.width}×${portPlan.canvas.height}</span></div></div>
        <div class="stat-card"><div class="stat-label">📦 主控数量</div><div class="stat-value" style="color:#fde68a;">${portPlan.controllerSummaries.length} 台</div></div>
        <div class="stat-card"><div class="stat-label">🔴 主电源线数</div><div class="stat-value" style="color:#ff7e6e;">${totalPowerCables} 根</div></div>
        <div class="stat-card"><div class="stat-label">🔵 主网线数</div><div class="stat-value" style="color:#6bc8ff;">${totalPortCables} 根</div></div>
        <div class="stat-card"><div class="stat-label">⚡ 峰值电源线负载</div><div class="stat-value">${peakPowerLoadActual} <span style="font-size:0.7em;color:#9aa6b5">/ ${maxPower} W</span></div></div>
        <div class="stat-card"><div class="stat-label">🌐 峰值网线负载</div><div class="stat-value">${peakPortLoadActual.toLocaleString()} <span style="font-size:0.7em;color:#9aa6b5">/ ${maxPixels.toLocaleString()} px</span></div></div>
    `;
    
    document.getElementById('maxPixelsSpan').innerText = maxPixels.toLocaleString();
    document.getElementById('maxPowerSpan').innerText = maxPower;
    document.getElementById('unitPowerSpan').innerText = unitPower;
    renderDynamicVisual(lastMatrix);
    setTimeout(drawCablingLines, 60);
}

function renderDynamicVisual(matrix) {
    if (!matrix.length) return;
    let rows = matrix.length, cols = matrix[0].length;
    let w = currentProductObj.pixelW, h = currentProductObj.pixelH;
    let ratio = h / w;
    let baseW = 96;
    let fullHeight = Math.min(140, Math.max(60, baseW * ratio));
    let halfHeight = fullHeight / 2;
    let html = `<div class="matrix-visual" style="grid-template-columns: repeat(${cols}, ${baseW}px);">`;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let mod = matrix[r][c];
            let height = mod.type === "Half" ? halfHeight : fullHeight;
            let portNum = parseInt(mod.portLabel.match(/D(\d+)/)?.[1] || 1);
            let borderTop = `hsl(${(portNum * 71) % 360}, 70%, 55%)`;
            let controllerHue = ((mod.controllerId || 1) * 43) % 360;
            let controllerBg = `linear-gradient(135deg, hsla(${controllerHue}, 62%, 28%, 0.82), hsla(${controllerHue + 20}, 62%, 42%, 0.52))`;
            html += `<div class="cab-module" data-row="${r}" data-col="${c}" style="height:${height}px; border-top-color: ${borderTop}; background:${controllerBg};">
                        <div class="controller-text">${mod.controllerLabel || ''}</div>
                        <div class="power-text">${mod.powerLabel}</div>
                        <div class="port-text">${mod.portLabel}</div>
                    </div>`;
        }
    }
    html += `</div>`;
    document.getElementById('cabVisual').innerHTML = html;
}

function drawCablingLines() {
    let container = document.querySelector('.matrix-visual');
    if (!container || !lastMatrix) return;
    let svg = document.getElementById('cablingSvg');
    if (!svg) {
        svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.id = 'cablingSvg';
        svg.style.position = 'absolute';
        svg.style.top = '0';
        svg.style.left = '0';
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.pointerEvents = 'none';
        svg.style.zIndex = '1';
        container.style.position = 'relative';
        container.appendChild(svg);
    }
    svg.innerHTML = '';
    
    let direction = document.getElementById('routeDirectionSelect').value;
    let powerGroups = {}, portGroups = {};
    
    for (let r = 0; r < lastMatrix.length; r++) {
        for (let c = 0; c < lastMatrix[0].length; c++) {
            let cell = lastMatrix[r][c];
            let el = container.querySelector(`[data-row="${r}"][data-col="${c}"]`);
            if (!el) continue;
            let cx = el.offsetLeft + el.offsetWidth/2;
            let cy = el.offsetTop + el.offsetHeight/2;
            
            let pMatch = cell.powerLabel.match(/P(\d+)-(\d+)/);
            if (pMatch) {
                let id = pMatch[1], seq = parseInt(pMatch[2]);
                if (!powerGroups[id]) powerGroups[id] = [];
                powerGroups[id].push({ seq, x: cx - 14, y: cy - 8, r: r, c: c });
            }
            let dMatch = cell.portLabel.match(/D(\d+)-(\d+)/);
            if (dMatch) {
                let id = `M${cell.controllerId || 1}-D${dMatch[1]}`, seq = parseInt(dMatch[2]);
                if (!portGroups[id]) portGroups[id] = [];
                portGroups[id].push({ seq, x: cx + 14, y: cy + 8, r: r, c: c });
            }
        }
    }
    
    const drawGroup = (groups, color, fillColor) => {
        for (let id in groups) {
            let pts = groups[id].sort((a,b) => a.seq - b.seq);
            if (!pts.length) continue;
            
            let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", pts[0].x); circle.setAttribute("cy", pts[0].y);
            circle.setAttribute("r", "5"); circle.setAttribute("fill", fillColor);
            svg.appendChild(circle);
            
            if (pts.length > 1) {
                let d = `M ${pts[0].x} ${pts[0].y}`;
                for (let i = 1; i < pts.length; i++) {
                    let p1 = pts[i-1];
                    let p2 = pts[i];
                    
                    if (direction === 'vertical' && p1.c !== p2.c) {
                        let startEl = container.querySelector(`[data-row="${p1.r}"][data-col="${p1.c}"]`);
                        let endEl = container.querySelector(`[data-row="${p2.r}"][data-col="${p2.c}"]`);
                        if (startEl && endEl) {
                            let containerRect = container.getBoundingClientRect();
                            let leftCol = Math.min(p1.c, p2.c);
                            let leftEl = container.querySelector(`[data-row="0"][data-col="${leftCol}"]`);
                            let rightEl = container.querySelector(`[data-row="0"][data-col="${leftCol+1}"]`);
                            if (leftEl && rightEl) {
                                let leftRect = leftEl.getBoundingClientRect();
                                let rightRect = rightEl.getBoundingClientRect();
                                let gapX = (leftRect.right + rightRect.left) / 2 - containerRect.left;
                                d += ` L ${gapX} ${p1.y} L ${gapX} ${p2.y} L ${p2.x} ${p2.y}`;
                            } else {
                                let x_gap = (p1.x + p2.x) / 2;
                                d += ` L ${x_gap} ${p1.y} L ${x_gap} ${p2.y} L ${p2.x} ${p2.y}`;
                            }
                        } else {
                            let x_gap = (p1.x + p2.x) / 2;
                            d += ` L ${x_gap} ${p1.y} L ${x_gap} ${p2.y} L ${p2.x} ${p2.y}`;
                        }
                    }
                    else if (direction === 'horizontal' && p1.r !== p2.r) {
                        let startEl = container.querySelector(`[data-row="${p1.r}"][data-col="${p1.c}"]`);
                        let endEl = container.querySelector(`[data-row="${p2.r}"][data-col="${p2.c}"]`);
                        if (startEl && endEl) {
                            let containerRect = container.getBoundingClientRect();
                            let topRow = Math.min(p1.r, p2.r);
                            let bottomRow = topRow + 1;
                            let topEl = container.querySelector(`[data-row="${topRow}"][data-col="0"]`);
                            let bottomEl = container.querySelector(`[data-row="${bottomRow}"][data-col="0"]`);
                            if (topEl && bottomEl) {
                                let topRect = topEl.getBoundingClientRect();
                                let bottomRect = bottomEl.getBoundingClientRect();
                                let gapY = (topRect.bottom + bottomRect.top) / 2 - containerRect.top;
                                d += ` L ${p1.x} ${gapY} L ${p2.x} ${gapY} L ${p2.x} ${p2.y}`;
                            } else {
                                let y_gap = (p1.y + p2.y) / 2;
                                d += ` L ${p1.x} ${y_gap} L ${p2.x} ${y_gap} L ${p2.x} ${p2.y}`;
                            }
                        } else {
                            let y_gap = (p1.y + p2.y) / 2;
                            d += ` L ${p1.x} ${y_gap} L ${p2.x} ${y_gap} L ${p2.x} ${p2.y}`;
                        }
                    }
                    else {
                        d += ` L ${p2.x} ${p2.y}`;
                    }
                }
                let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d); path.setAttribute("stroke", color);
                path.setAttribute("stroke-width", "2.5"); path.setAttribute("fill", "none");
                path.setAttribute("stroke-linecap", "round"); path.setAttribute("stroke-linejoin", "round");
                svg.appendChild(path);
            }
        }
    };
    drawGroup(powerGroups, "#ff5c5c", "#ff3333");
    drawGroup(portGroups, "#3ea5ff", "#2299ff");
}

function syncRecommendedDimensions() {
    if (_fullCount > 0) {
        let best = findBestRectangle(_fullCount, currentProductObj.pixelW, currentProductObj.pixelH);
        document.getElementById('customCols').value = best.cols;
        document.getElementById('customRows').value = best.rows;
        computeSystem();
    }
}

function promptCustomPortCapacity() {
    let current = getMaxPortPixels();
    let inputVal = prompt(`请输入“${_currentSystem}”+“${_currentBandwidth}”+“${document.getElementById('bitRateSelect').value}”的单网口最大带载像素(单位:px):`, current);
    if (inputVal !== null && !isNaN(parseInt(inputVal))) {
        let key = `${_currentSystem}|${_currentBandwidth}|${document.getElementById('bitRateSelect').value}`;
        customPortCapacities[key] = parseInt(inputVal);
        localStorage.setItem('customPortCapacities', JSON.stringify(customPortCapacities));
        computeSystem();
    }
}

function init() {
    updateBitRateOptions();
    updateMasterCanvasOptions();
    
    document.getElementById('bitRateSelect').onchange = () => computeSystem();
    document.getElementById('voltageSelect').onchange = () => computeSystem();
    document.getElementById('routeDirectionSelect').onchange = () => computeSystem();
    document.getElementById('masterCanvasSelect').onchange = () => computeSystem();
    document.getElementById('customCols').addEventListener('input', () => computeSystem());
    document.getElementById('customRows').addEventListener('input', () => computeSystem());
    document.getElementById('addHalfRowCheckbox').addEventListener('change', () => computeSystem());
    document.getElementById('recommendBtn').addEventListener('click', () => syncRecommendedDimensions());
    
    document.getElementById('exportBothPDF').onclick = () => {
        let el = document.querySelector('.right-panel');
        let ruleHint = document.getElementById('ruleHint');
        if(ruleHint) ruleHint.style.display = 'none';
        
        let contentWidth = el.offsetWidth;
        let contentHeight = el.offsetHeight + 40; 
        
        let opt = {
            margin:       0,
            filename:     `Topology_Report_${currentProductObj.model || 'Unknown'}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, backgroundColor: '#0b0e14', useCORS: true },
            jsPDF:        { unit: 'px', format: [contentWidth, contentHeight], orientation: 'landscape' },
            pagebreak:    { mode: 'avoid-all' } 
        };
        
        html2pdf().set(opt).from(el).save().then(() => {
            if(ruleHint) ruleHint.style.display = 'block';
        }).catch(err => {
            console.error("PDF导出失败:", err);
            if(ruleHint) ruleHint.style.display = 'block';
        });
    };
  
    document.getElementById('maxPixelsSpan').style.cursor = 'pointer';
    document.getElementById('maxPixelsSpan').title = '点击修改当前主控/网口/色深的带载上限';
    document.getElementById('maxPixelsSpan').onclick = () => promptCustomPortCapacity();

window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'SYNC_MAPPING') {
        // 必须解构 hasHalfSupport
        const { model, fullCount, system, bandwidth, pixelW, pixelH, power, hasHalfSupport } = event.data;
        
        if (model) currentProductObj.model = model;
        if (pixelW !== undefined) currentProductObj.pixelW = pixelW;
        if (pixelH !== undefined) currentProductObj.pixelH = pixelH;
        if (power !== undefined) currentProductObj.power = power;
        if (fullCount !== undefined) _fullCount = fullCount;
        if (system) _currentSystem = system;
        if (bandwidth) _currentBandwidth = bandwidth;
        
        // 控制 Half Panel 复选框
        const halfCheckbox = document.getElementById('addHalfRowCheckbox');
        if (hasHalfSupport !== undefined) {
            halfCheckbox.disabled = !hasHalfSupport;
            if (!hasHalfSupport) halfCheckbox.checked = false;
        }
        
        updateBitRateOptions();
        updateMasterCanvasOptions();
        syncRecommendedDimensions();  // 这行会按16:9自动填充大屏宽高
    }
});

    document.getElementById('cabVisual').innerHTML = '<div style="padding:30px;">⏳ 等待备品系统发送数据 (postMessage SYNC_MAPPING)...</div>';
     document.getElementById('addHalfRowCheckbox').disabled = true;
}

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>安装人力工时评估</title>
<style>
  /* --- 现代极简风格全局重置 --- */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
  }
  
  body {
    background: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #071426 100%);
    color: #e2e8f0;
    min-height: 100vh;
    padding: 2.5rem 1.2rem;
    line-height: 1.5;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
  }

  /* --- 头部标题 --- */
  .hero {
    text-align: center;
    margin-bottom: 2.5rem;
  }
  .hero h1 {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #38bdf8, #0ea5e9, #6366f1);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-shadow: 0 4px 20px rgba(14, 165, 233, 0.15);
  }

  /* --- 极简玻璃拟态卡片 --- */
  .card {
    background: rgba(30, 41, 59, 0.45);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    padding: 2rem;
    margin-bottom: 1.5rem;
    transition: all 0.3s ease;
  }

  .card-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 1.5rem;
    color: #f8fafc;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.5px;
  }
  .card-title::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 18px;
    background: linear-gradient(to bottom, #38bdf8, #6366f1);
    border-radius: 4px;
  }

  /* --- 表单布局 --- */
  .grid-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .form-group label {
    font-weight: 600;
    font-size: 0.85rem;
    color: #38bdf8;
    letter-spacing: 0.5px;
  }

  select, input[type="number"] {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 0.8rem 1rem;
    font-size: 0.95rem;
    font-weight: 500;
    color: #f1f5f9;
    transition: all 0.2s ease;
    outline: none;
    width: 100%;
  }
  select:focus, input:focus {
    border-color: #38bdf8;
    background: rgba(15, 23, 42, 0.8);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
  }
  select option {
    background: #1e293b;
    color: #f1f5f9;
  }

  /* --- 面积结果标签 --- */
  .badge-container {
    margin-top: 1.2rem;
  }
  .badge {
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.25);
    border-radius: 12px;
    padding: 0.6rem 1.2rem;
    font-size: 0.85rem;
    color: #e2e8f0;
    display: inline-block;
  }
  .badge strong {
    color: #818cf8;
    font-size: 1.05rem;
    margin: 0 2px;
  }

  /* --- 复选框群组 --- */
  .coeff-group {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 1.5rem;
  }
  .coeff-item {
    background: rgba(15, 23, 42, 0.4);
    padding: 0.6rem 1.2rem;
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    cursor: pointer;
    user-select: none;
    transition: all 0.2s;
  }
  .coeff-item:hover {
    background: rgba(15, 23, 42, 0.6);
    border-color: rgba(56, 189, 248, 0.15);
  }
  .coeff-item input[type="checkbox"] {
    accent-color: #38bdf8;
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  .coeff-item label {
    font-size: 0.85rem;
    color: #94a3b8;
    cursor: pointer;
  }
  .coeff-item input:checked + label {
    color: #f1f5f9;
  }

  /* --- 人员定制弹性排班 --- */
  .slider-panel {
    background: rgba(15, 23, 42, 0.4);
    border-radius: 16px;
    padding: 1.2rem;
    margin-top: 0.5rem;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }
  .flex-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .flex-between span {
    font-size: 0.85rem;
    color: #94a3b8;
  }
  #currentStaffValue {
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    padding: 4px 14px;
    border-radius: 20px;
    color: #ffffff;
    font-weight: 700;
    font-size: 0.9rem;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
  }
  
  input[type="range"] {
    width: 100%;
    margin: 1rem 0;
    -webkit-appearance: none;
    background: rgba(255, 255, 255, 0.1);
    height: 6px;
    border-radius: 10px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    background: #38bdf8;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid #ffffff;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    transition: transform 0.1s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }

  /* --- 主结果输出看板 --- */
  .result-area-compact {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .result-mini {
    background: rgba(15, 23, 42, 0.3);
    border-radius: 16px;
    padding: 1rem;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }
  .result-mini .num {
    font-size: 1.6rem;
    font-weight: 700;
    color: #38bdf8;
  }

  .big-result-card {
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.6) 0%, rgba(30, 41, 59, 0.6) 100%);
    border-radius: 20px;
    padding: 1.8rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.5rem;
    border: 1px solid rgba(56, 189, 248, 0.25);
    box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.05);
  }
  .big-item {
    flex: 1;
    text-align: center;
    position: relative;
  }
  .big-item:not(:last-child)::after {
    content: '';
    position: absolute;
    right: -0.75rem;
    top: 20%;
    height: 60%;
    width: 1px;
    background: rgba(255, 255, 255, 0.08);
  }
  .big-number {
    font-size: 3rem;
    font-weight: 800;
    line-height: 1.1;
  }
  #finalPeople {
    color: #38bdf8;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
  }
  #finalDays {
    color: #4ade80;
    text-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
  }
  .big-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: #94a3b8;
    margin-top: 0.5rem;
  }

  /* --- 警告与规范备注说明 --- */
  .warning-msg {
    background: rgba(239, 68, 68, 0.12);
    border-left: 4px solid #ef4444;
    padding: 0.8rem 1.2rem;
    border-radius: 12px;
    font-size: 0.85rem;
    margin-top: 1.2rem;
    color: #fca5a5;
  }
  .remark-note {
    background: rgba(15, 23, 42, 0.25);
    padding: 1.2rem;
    border-radius: 16px;
    font-size: 0.85rem;
    color: #94a3b8;
    margin-top: 1.5rem;
    line-height: 1.7;
    border: 1px solid rgba(255, 255, 255, 0.02);
  }
  .remark-title {
    color: #e2e8f0;
    font-weight: 700;
    margin-bottom: 0.4rem;
  }
  .remark-note ol {
    padding-left: 1.2rem;
  }
  .remark-note li {
    margin-bottom: 0.3rem;
  }

  /* --- 响应式适配 --- */
  @media (max-width: 768px) {
    .grid-2col { grid-template-columns: 1fr; gap: 1rem; }
    .big-result-card { flex-direction: column; padding: 1.2rem; }
    .big-item:not(:last-child)::after { display: none; }
    .big-item { padding: 0.5rem 0; }
    .card { padding: 1.2rem; }
  }
</style>
</head>

<div class="container">

    </div>

      <div class="form-group">
        <label>🌀 非标准尺寸/弧形屏体总面积 (㎡)</label>
        <input type="number" id="nonStdArea" value="0" step="0.5" min="0">
      </div>
    </div>
    
    <div class="badge-container">

    </div>

    <div class="coeff-group">
      <div class="coeff-item">
        <input type="checkbox" id="highAltitude"> 
        <label for="highAltitude">⛰️ 高空作业（≥5米）</label>
      </div>
      <div class="coeff-item">
        <input type="checkbox" id="logistics"> 
        <label for="logistics">📦 卸货/场内转运</label>
      </div>
    </div>

    <div class="card-title" style="margin-top:1.8rem;">👥 人员定制</div>
    <div class="slider-panel">
      <div class="flex-between">
        <span style="color: #f8fafc; font-weight:600;">人员调整</span>

      </div>
      <input type="range" id="staffSlider" min="1" max="50" step="1" value="1">
      <div class="flex-between" style="margin-top:4px; justify-content: center;">
        <span id="optimalStaffHint" style="color:#38bdf8; font-weight: 600;">⭐ 推荐人数: - 人</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📊 人力工时预估</div>
    <div class="result-area-compact" style="display:none;">
      <div class="result-mini"><div class="num" id="basePeople">—</div></div>
      <div class="result-mini"><div class="num" id="baseDays">—</div></div>
    </div>
    
    <div class="big-result-card">
      <div class="big-item">
        <div class="big-number" id="finalPeople">0</div>
        <div class="big-label">🧑‍🔧 最终配置人数</div>
      </div>
      <div class="big-item">
        <div class="big-number" id="finalDays">0.0</div>
        <div class="big-label">📅 预估工期 (天)</div>
      </div>
    </div>
    
    <div id="warningMsg" class="warning-msg" style="display:none;"></div>
    
    <div class="remark-note">
      <div class="remark-title">💡 备注说明：</div>
      <ol>
        <li>本费用仅为初步预估，现场施工须安排具备实操经验的专业工程师执行；</li>
        <li>项目涉及高空作业、货物卸货等特殊作业，请勾选对应项目予以确认；</li>

      </ol>
    </div>
  </div>
</div>

const DB = {};
function buildDB() {
  for (let [pitch, rows] of Object.entries(MATRIX_RAW)) {
    DB[pitch] = [];
    for (let r of rows) {
      let [minA, maxA, hP, hD, sP, sD, wP, wD] = r;
      DB[pitch].push({
        min: minA, max: maxA,
        hoist: { p: hP, d: hD },
        seat: { p: sP, d: sD },
        wall: { p: wP, d: wD }
      });
    }
  }
}
buildDB();

function findMatch(pitchKey, area) {
  const arr = DB[pitchKey];
  if (!arr) return null;
  for (let seg of arr) {
    if (area >= seg.min && area <= seg.max) return seg;
  }
  if (area > arr[arr.length-1].max) return arr[arr.length-1];
  if (area < arr[0].min) return arr[0];
  return null;
}

function getPitchLimit(pitchKey) {
  const limits = { p1_below:200, p1_p2:500, p2_p3:800, p3_p4:1000, p4_above:1000 };
  return limits[pitchKey];
}

function computeAll(triggeredBySlider = false) {
  const pitchKey = document.getElementById('pitchSelect').value;
  const installMethod = document.getElementById('installMethod').value;

  let std = parseFloat(document.getElementById('stdArea').value) || 0;
  let nonStd = parseFloat(document.getElementById('nonStdArea').value) || 0;
  if (std < 0) std = 0; if (nonStd < 0) nonStd = 0;

  const equivArea = std + (nonStd * 2.0);
  document.getElementById('equivAreaSpan').innerText = equivArea.toFixed(1);

  const limit = getPitchLimit(pitchKey);
  const warnDiv = document.getElementById('warningMsg');
  if (equivArea > limit) {
    warnDiv.style.display = 'block';
    warnDiv.innerHTML = `⚠️ 等效面积 ${equivArea.toFixed(1)}㎡ 超过设计上限 ${limit}㎡，请对接技术部沟通确认调整。`;
  } else {
    warnDiv.style.display = 'none';
  }

  const matched = findMatch(pitchKey, equivArea);
  if (!matched) return;

  let basePeople, baseDays;
  if (installMethod === 'hoist') {
    basePeople = matched.hoist.p;
    baseDays = matched.hoist.d;
  } else if (installMethod === 'seat') {
    basePeople = matched.seat.p;
    baseDays = matched.seat.d;
  } else {
    basePeople = matched.wall.p;
    baseDays = matched.wall.d;
  }

  // 系数作用于基础人数，不影响矩阵原始天数
  let adjustedPeople = basePeople;
  if (document.getElementById('highAltitude').checked) adjustedPeople *= 1.3;
  if (document.getElementById('logistics').checked) adjustedPeople *= 1.5;
  
  // 向上取整确保安全冗余
  adjustedPeople = Math.ceil(adjustedPeople);

  document.getElementById('basePeople').innerText = adjustedPeople;
  document.getElementById('baseDays').innerText = baseDays.toFixed(1);

  const slider = document.getElementById('staffSlider');
  let minStaff = Math.max(1, Math.floor(adjustedPeople * 0.5));
  let maxStaff = Math.max(minStaff+1, Math.ceil(adjustedPeople * 3));
  maxStaff = Math.min(maxStaff, 50);
  slider.min = minStaff;
  slider.max = maxStaff;

  if (!triggeredBySlider) {
    slider.value = adjustedPeople;
  } else {
    let cur = parseInt(slider.value);
    if (cur < minStaff) slider.value = minStaff;
    if (cur > maxStaff) slider.value = maxStaff;
  }
  document.getElementById('currentStaffValue').innerText = slider.value + " 人";
  document.getElementById('optimalStaffHint').innerHTML = `⭐ 推荐人数: ${adjustedPeople} 人`;

  const finalPeople = parseInt(slider.value);
  let finalDays = 0;
  if (finalPeople === adjustedPeople) {
    finalDays = baseDays;
  } else {
    // 弹性排班算法：总工时 = 推荐人数 * 原始天数
    const totalManDays = adjustedPeople * baseDays;
    let raw = totalManDays / finalPeople;
    finalDays = Math.ceil(raw * 2) / 2; // 0.5天步长向上取整
  }
  document.getElementById('finalPeople').innerText = finalPeople;
  document.getElementById('finalDays').innerText = finalDays.toFixed(1);
}

function bindEvents() {
  const ids = ['pitchSelect', 'installMethod', 'stdArea', 'nonStdArea', 'highAltitude', 'logistics'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('change', () => computeAll(false));
      if (id === 'stdArea' || id === 'nonStdArea') el.addEventListener('input', () => computeAll(false));
    }
  });
  const slider = document.getElementById('staffSlider');
  slider.addEventListener('input', () => computeAll(true));
}

window.addEventListener('DOMContentLoaded', () => {
  bindEvents();
  computeAll(false);
});
</script>
